<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Favoriler — ADL EKSPER</title>
  <meta name="description" content="ADL EKSPER favorileriniz" />
  <link rel="icon" href="assets/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">
  <header class="bg-black text-white">
    <div class="container mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="font-semibold">ADL EKSPER</a>
      <div class="text-xs text-gray-300">Usta: <span class="text-white font-medium">Cemil Adalı</span></div>
    </div>
  </header>

  <main class="container mx-auto px-6 py-12">
    <h1 class="text-2xl font-bold mb-6">Favoriler</h1>
    <div id="fav-list" class="space-y-4"></div>
  </main>

  <script>
    function renderFavs(){ const f = JSON.parse(localStorage.getItem('adl_fav')||'[]'); const container = document.getElementById('fav-list'); container.innerHTML=''; if(f.length===0){ container.innerHTML='<p>Henüz favori yok.</p>'; return; } f.forEach((name,idx)=>{ const el = document.createElement('div'); el.className='p-4 border rounded flex justify-between items-center'; el.innerHTML=`<div class="font-semibold">${name}</div><div><button data-idx="${idx}" class="remove-fav px-3 py-1 border rounded">Kaldır</button></div>`; container.appendChild(el); }); document.querySelectorAll('.remove-fav').forEach(b=>b.addEventListener('click', function(){ const idx = +this.dataset.idx; let f = JSON.parse(localStorage.getItem('adl_fav')||'[]'); f.splice(idx,1); localStorage.setItem('adl_fav', JSON.stringify(f)); renderFavs(); })); }
    renderFavs();
  </script>
</body>
</html>
