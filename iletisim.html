<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>İletişim — ADL EKSPER</title>
  <meta name="description" content="ADL EKSPER iletişim formu ve iletişim bilgileri." />
  <link rel="icon" href="assets/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">
  <header class="bg-black text-white">
    <div class="container mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="font-semibold">ADL EKSPER</a>
        <div class="text-xs text-gray-300">Usta: <span class="text-white font-medium">Cemil Adalı</span></div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold">İletişim</h1>
    <p class="mt-2 text-gray-600">Sorularınız için aşağıdaki formu doldurabilirsiniz.</p>

    <div class="mt-8 grid md:grid-cols-2 gap-8">
      <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-4">
        <label class="block"><span class="text-sm font-medium">Adınız</span><input name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" /></label>
        <label class="block"><span class="text-sm font-medium">E-posta</span><input type="email" name="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" /></label>
        <label class="block"><span class="text-sm font-medium">Mesaj</span><textarea name="message" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea></label>
        <button type="submit" class="px-4 py-2 bg-brand text-white rounded">Gönder</button>
      </form>

      <div>
        <h3 class="font-semibold">ADL EKSPER</h3>
        <p class="text-sm text-gray-600 mt-2">Telefon: <a href="tel:+905555555555" class="text-brand">+90 555 555 55 55</a></p>
        <p class="text-sm text-gray-600">E-posta: <a href="mailto:info@adlekspersite.com" class="text-brand">info@adlekspersite.com</a></p>

        <div class="mt-6">
          <h4 class="font-medium">Çalışma Saatleri</h4>
          <p class="text-sm text-gray-600 mt-2">Hafta içi: 09:00 - 18:00</p>
          <p class="text-sm text-gray-600">Cumartesi: 09:00 - 18:00</p>
          <p class="text-sm text-gray-600">Pazar: Kapalı</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-black text-white py-6 text-center">© <span id="year">2026</span> ADL EKSPER</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
